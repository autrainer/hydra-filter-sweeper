defaults:
  - _self_
  - override hydra/sweeper: filter

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      +foo: 1,2,3
      +bar: one, two, three
    filters:
      - hydra_filter_sweeper.Expression:
          expr: foo == 1 and bar == "two"
      - hydra_filter_sweeper.Expression:
          expr: baz == 2 and bar == "three"
