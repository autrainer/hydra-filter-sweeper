defaults:
  - _self_
  - override hydra/sweeper: filter

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      +foo: 1,2,3
      +bar: one, two, three
    filters:
      - hydra_filter_sweeper.Expression:
          expr: foo == 1 and bar == "two"
      - hydra_filter_sweeper.Expression:
          expr: foo == 2 and bar == "three"
      - hydra_filter_sweeper.Expression:
          expr: undefined == 1 and bar == "three"
          _fail_: false
      - hydra_filter_sweeper.Expression:
        expr: undefined == 1 and bar == "three"
        _fail_: false
        _log_: false
